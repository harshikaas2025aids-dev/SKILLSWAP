<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exchange Requests - SkillSwap</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="app-wrapper">
  <!-- Sidebar -->
  <div th:replace="~{fragments/navigation :: sidebar('requests')}"></div>

  <!-- Main Content -->
  <main class="app-main">
    <div th:replace="~{fragments/navigation :: header('Exchange Requests')}"></div>

    <div class="page-container">
      <!-- Tabs Navigation -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 14px;">
        <div style="display: flex; gap: 10px;">
          <button class="btn btn-forest request-tab-btn" data-tab="received" onclick="SkillSwap.loadRequestsTab('received')">
            Received Requests
          </button>
          <button class="btn btn-secondary request-tab-btn" data-tab="sent" onclick="SkillSwap.loadRequestsTab('sent')">
            Sent Requests
          </button>
        </div>

        <a th:href="@{/matches(studentId=${activeStudentId})}" class="btn btn-primary btn-sm">
          <span>+ Find New Partners</span>
        </a>
      </div>

      <!-- Requests List Container -->
      <div id="requestsListContainer">
        <div class="loading-box"><div class="spinner"></div><p>Loading requests...</p></div>
      </div>
    </div>
  </main>
</div>

<script th:src="@{/js/app.js}"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    SkillSwap.initRequests();
  });
</script>
</body>
</html>
