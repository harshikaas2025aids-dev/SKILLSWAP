<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Directory - SkillSwap</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="app-wrapper">
  <!-- Sidebar -->
  <div th:replace="~{fragments/navigation :: sidebar('students')}"></div>

  <!-- Main Content -->
  <main class="app-main">
    <div th:replace="~{fragments/navigation :: header('Student Directory')}"></div>

    <div class="page-container">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 14px;">
        <div>
          <h3 style="font-size: 1.35rem; font-weight: 800; color: var(--deep-forest);">Registered Campus Students</h3>
          <p style="font-size: 0.88rem; color: var(--text-muted);">
            Discover classmates and view their profiles on the SkillSwap network.
          </p>
        </div>

        <a th:href="@{/register}" class="btn btn-primary">
          <span>+ Register New Student</span>
        </a>
      </div>

      <!-- Students Grid Container -->
      <div id="studentsDirectoryContainer">
        <div class="loading-box"><div class="spinner"></div><p>Loading student directory...</p></div>
      </div>
    </div>
  </main>
</div>

<script th:src="@{/js/app.js}"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    SkillSwap.initStudents();
  });
</script>
</body>
</html>
